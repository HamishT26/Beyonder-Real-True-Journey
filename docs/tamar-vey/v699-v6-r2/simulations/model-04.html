<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disconnected provenance — synthetic finite sheaf model</title><style>body{font-family:system-ui;background:#07111f;color:#eef;padding:1rem}canvas{border:2px solid #fb7185;max-width:100%;background:#020617}table{border-collapse:collapse;margin-top:1rem}th,td{border:1px solid #64748b;padding:.4rem}button{padding:.5rem;margin:.3rem}</style></head><body><h1>Disconnected provenance</h1><p>This is a wholly synthetic three-dimensional projection. It is not a physical observation, professional assessment, authority decision, or empirical GMUT result.</p><button id="toggle" aria-pressed="true">Pause rotation</button><canvas id="scene" width="720" height="440" role="img" aria-label="Rotating synthetic node and edge projection"></canvas><h2>Accessible data table</h2><table><thead><tr><th>Node</th><th>x</th><th>y</th><th>z</th><th>status</th></tr></thead><tbody id="rows"></tbody></table><script>const nodes=Array.from({length:8},(_,i)=>({id:'n'+i,x:Math.cos(i*1.7),y:Math.sin(i*1.7),z:(i%3-1)*.55,status:i===3?'retained obstruction':'synthetic consistent'}));const edges=nodes.slice(1).map((n,i)=>[i,i+1]);const c=document.getElementById('scene'),x=c.getContext('2d'),rows=document.getElementById('rows');rows.innerHTML=nodes.map(n=>'<tr><td>'+n.id+'</td><td>'+n.x.toFixed(3)+'</td><td>'+n.y.toFixed(3)+'</td><td>'+n.z.toFixed(3)+'</td><td>'+n.status+'</td></tr>').join('');let angle=0,running=true;document.getElementById('toggle').onclick=e=>{running=!running;e.currentTarget.textContent=running?'Pause rotation':'Resume rotation';e.currentTarget.setAttribute('aria-pressed',String(running));if(running)requestAnimationFrame(draw)};function project(n){const ca=Math.cos(angle),sa=Math.sin(angle),rx=n.x*ca-n.z*sa,rz=n.x*sa+n.z*ca,s=180/(3+rz);return[360+rx*s,220+n.y*s,rz]}function draw(){x.clearRect(0,0,c.width,c.height);const p=nodes.map(project);x.strokeStyle='#c084fc';x.lineWidth=3;for(const[e1,e2]of edges){x.beginPath();x.moveTo(p[e1][0],p[e1][1]);x.lineTo(p[e2][0],p[e2][1]);x.stroke()}for(let i=0;i<p.length;i++){x.fillStyle=i===3?'#fb7185':'#fb7185';x.beginPath();x.arc(p[i][0],p[i][1],9,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.fillText(nodes[i].id,p[i][0]+12,p[i][1])}if(running){angle+=.006;requestAnimationFrame(draw)}}draw();</script></body></html>
