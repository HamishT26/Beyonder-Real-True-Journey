<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tamar v705-v5 finite evidence observatory</title><style>body{font:16px system-ui;background:#07131f;color:#eaf4ff;margin:0}main{max-width:980px;margin:auto;padding:24px}section{background:#10263a;border:1px solid #5c7f9d;border-radius:14px;padding:18px;margin:14px 0}button,select{font:inherit;padding:8px;margin:4px;background:#173d59;color:#fff;border:1px solid #86b6db;border-radius:7px}button:focus,select:focus{outline:3px solid #ffd166}canvas{width:100%;height:360px;background:#06101a;border:1px solid #86b6db}table{border-collapse:collapse;width:100%}th,td{border:1px solid #86b6db;padding:8px;text-align:left}.boundary{border-left:6px solid #ffd166;padding-left:12px}</style></head><body><main><h1>Finite evidence-frame observatory</h1><p class="boundary" id="boundary">Representation-only exact rational coordinates. No physical measurement, human belief observation, identity fact, authorized decision, or Stage 20 claim.</p><section><label for="model">Fixture</label><select id="model" aria-describedby="boundary"></select><button id="previous">Previous</button><button id="next">Next</button><button id="pause" aria-pressed="true">Paused</button><button id="reset">Reset view</button><p id="status" role="status"></p></section><section><canvas id="plot" width="900" height="360" aria-label="Three-axis finite coordinate plot"></canvas><table><caption>Exact rational coordinates</caption><thead><tr><th>Axis</th><th>Value</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const models=[{"id":"TV7055-MODEL-EF-01","fixture_id":"EF-01","axes":["a","b","c"],"coordinates":["43/120","23/60","31/120"],"layout_only":true,"physical_measurement":false,"source_contract":"TV7055-P256","evidence_class":"finite_synthetic_layout"},{"id":"TV7055-MODEL-EF-02","fixture_id":"EF-02","axes":["a","b","c"],"coordinates":["1/3","49/120","31/120"],"layout_only":t 11","fixture_id":"EF-11","axes":["a","b","c"],"coordinates":["43/120","13/30","5/24"],"layout_only":true,"physical_measurement":false,"source_contract":"TV7055-P266","evidence_class":"finite_synthetic_layout"},{"id":"TV7055-MODEL-EF-12","fixture_id":"EF-12","axes":["a","b","c"],"coordinates":["23/60","43/120","31/120"],"layout_only":true,"physical_measurement":false,"source_contract":"TV7055-P267","evidence_class":"finite_synthetic_layout"},{"id":"TV7055-MODEL-EF-13","fixture_id":"EF-13","axes":["a","b","c"],"coordinates":["43/120","23/60","31/120"],"layout_only":true,"physical_measurement":false,"source_contract":"TV7055-P268","evidence_class":"finite_synthetic_layout"},{"id":"TV7055-MODEL-EF-14","fixture_id":"EF-14","axes":["a","b","c"],"coordinates":["1/3","49/120","31/120"],"layout_only":true,"physical_measurement":false,"source_contract":"TV7055-P269","evidence_class":"finite_synthetic_layout"},{"id":"TV7055-MODEL-EF-15","fixture_id":"EF-15","axes":["a","b","c"],"coordinates":["49/120","23/60","5/24"],"layout_only":true,"physical_measurement":false,"source_contract":"TV7055-P270","evidence_class":"finite_synthetic_layout"}];let index=0,paused=true,yaw=30,pitch=-18;const q=s=>document.querySelector(s),sel=q('#model'),ctx=q('#plot').getContext('2d');for(const m of models){const o=document.createElement('option');o.value=m.id;o.textContent=m.fixture_id;sel.append(o)}function frac(s){const [a,b='1']=s.split('/').map(Number);return a/b}function draw(){const m=models[index];sel.value=m.id;q('#rows').innerHTML=m.axes.map((a,i)=>'<tr><th>'+a+'</th><td>'+m.coordinates[i]+'</td></tr>').join('');q('#status').textContent=m.fixture_id+'; yaw '+yaw+'; pitch '+pitch+'; '+(paused?'paused':'running');ctx.clearRect(0,0,900,360);ctx.strokeStyle='#86b6db';ctx.fillStyle='#ffd166';ctx.lineWidth=2;const origin=[450,290],axes=[[300,-150],[-300,-150],[0,-250]];for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(...origin);ctx.lineTo(origin[0]+axes[i][0],origin[1]+axes[i][1]);ctx.stroke();ctx.fillText(m.axes[i],origin[0]+axes[i][0],origin[1]+axes[i][1])}const vals=m.coordinates.map(frac),x=origin[0]+vals[0]*axes[0][0]+vals[1]*axes[1][0]+vals[2]*axes[2][0],y=origin[1]+vals[0]*axes[0][1]+vals[1]*axes[1][1]+vals[2]*axes[2][1];ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()}sel.onchange=()=>{index=models.findIndex(x=>x.id===sel.value);draw()};q('#previous').onclick=()=>{index=(index+models.length-1)%models.length;draw()};q('#next').onclick=()=>{index=(index+1)%models.length;draw()};q('#pause').onclick=()=>{paused=!paused;q('#pause').setAttribute('aria-pressed',String(paused));q('#pause').textContent=paused?'Paused':'Running';draw()};q('#reset').onclick=()=>{yaw=30;pitch=-18;paused=true;q('#pause').setAttribute('aria-pressed','true');q('#pause').textContent='Paused';draw()};draw();</script></body></html>
