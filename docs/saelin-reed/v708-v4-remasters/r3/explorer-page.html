<style>
#ghc-variational-r3 .state-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
#ghc-variational-r3 .state-plot{width:100%;display:block;overflow:visible}
#ghc-variational-r3 .state-plot text{fill:var(--foreground);font-size:12px}
#ghc-variational-r3 .state-plot .axis{stroke:var(--border);stroke-width:1}
#ghc-variational-r3 .state-plot .position{fill:var(--viz-series-1)}
#ghc-variational-r3 .state-plot .velocity{stroke:var(--viz-series-2);stroke-width:2}
#ghc-variational-r3 .selection{padding-right:90px;margin-bottom:16px}
@media(max-width:600px){#ghc-variational-r3 .state-layout{grid-template-columns:minmax(0,1fr)}}
</style>
<div id="ghc-variational-r3">
  <div class="selection">
    <label class="form-label" for="ghc-var-model">Mechanics example</label>
    <select class="form-select" id="ghc-var-model"></select>
  </div>
  <div class="state-layout">
    <div id="ghc-var-inputs" class="viz-controls"></div>
    <div>
      <svg class="state-plot" id="ghc-var-plot" role="img" aria-labelledby="ghc-var-plot-title ghc-var-plot-desc">
        <title id="ghc-var-plot-title">Coordinate and velocity projection</title>
        <desc id="ghc-var-plot-desc">Position q and r, with a velocity direction. Normalized units; no trajectory is simulated.</desc>
        <defs><clipPath id="ghc-var-clip"><rect id="ghc-var-clip-rect"/></clipPath></defs>
        <line id="ghc-var-x-axis" class="axis"/><line id="ghc-var-y-axis" class="axis"/>
        <text id="ghc-var-x-label">q, normalized</text><text id="ghc-var-y-label">r</text>
        <text id="ghc-var-minus">−4</text><text id="ghc-var-plus">4</text>
        <g clip-path="url(#ghc-var-clip)"><line id="ghc-var-velocity" class="velocity"/><circle id="ghc-var-position" class="position" r="5"/></g>
      </svg>
      <table class="table table-sm tabular-nums"><thead><tr><th scope="col">Equation</th><th scope="col" class="text-end">Residual</th></tr></thead><tbody id="ghc-var-results" aria-live="polite"></tbody></table>
      <div class="text-small text-muted">Rounded evaluation; fixed coordinate range −4 to 4.</div>
    </div>
  </div>
  <p class="text-destructive" role="alert" id="ghc-var-error"></p>
</div>
<script>
(()=>{
 'use strict';
 const root=document.getElementById('ghc-variational-r3');
 const models=[{"action":{"q^2":"-1/2","v^2":"1/2"},"checks":3,"empirical_credit":0,"energy":{"q^2":"1/2","v^2":"1/2"},"id":"A01","limitation":"Normalized positive kinetic and harmonic coefficients.","name":"Canonical oscillator","rayleigh":{},"residuals":{"q":{"a":"1","q":"1"}}},{"action":{"q^2":"-1/2","r^2":"-1","v*w":"1","v^2":"1","w^2":"3/2"},"checks":4,"empirical_credit":0,"energy":{"q^2":"1/2","r^2":"1","v*w":"1","v^2":"1","w^2":"3/2"},"id":"A02","limitation":"A symmetric positive kinetic matrix; coordinates remain coupled.","name":"Mixed kinetic form","rayleigh":{},"residuals":{"q":{"a":"2","b":"1","q":"1"},"r":{"a":"1","b":"3","r":"2"}}},{"action":{"q^2":"-1/2","q^2*v^2":"1/2","v^2":"1/2"},"checks":3,"empirical_credit":0,"energy":{"q^2":"1/2","q^2*v^2":"1/2","v^2":"1/2"},"id":"A03","limitation":"The derivative of the kinetic coefficient contributes a velocity-square term.","name":"Coordinate-dependent mass","rayleigh":{},"residuals":{"q":{"a":"1","q":"1","q*v^2":"1","q^2*a":"1"}}},{"action":{"q^2*r^2":"-1/2","q^4":"-1/4","r^4":"-1/4","v^2":"1/2","w^2":"1/2"},"checks":4,"empirical_credit":0,"energy":{"q^2*r^2":"1/2","q^4":"1/4","r^4":"1/4","v^2":"1/2","w^2":"1/2"},"id":"A04","limitation":"Two coupled coordinates with a declared nonnegative quartic potential.","name":"Quartic interaction","rayleigh":{},"residuals":{"q":{"a":"1","q*r^2":"1","q^3":"1"},"r":{"b":"1","q^2*r":"1","r^3":"1"}}},{"action":{"q^2":"-1/2","v^2*t":"1/2"},"checks":3,"empirical_credit":0,"energy":{"q^2":"1/2","v^2*t":"1/2"},"id":"A05","limitation":"Use t>0 for a nonsingular positive kinetic coefficient.","name":"Time-dependent mass","rayleigh":{},"residuals":{"q":{"a*t":"1","q":"1","v":"1"}}},{"action":{"q*t":"1","q^2":"-1/2","v^2":"1/2"},"checks":3,"empirical_credit":0,"energy":{"q*t":"-1","q^2":"1/2","v^2":"1/2"},"id":"A06","limitation":"A prescribed source; total closed-system energy is not claimed.","name":"External forcing","rayleigh":{},"residuals":{"q":{"a":"1","q":"1","t":"-1"}}},{"action":{"q*w":"1/2","r*v":"-1/2","v^2":"1/2","w^2":"1/2"},"checks":4,"empirical_credit":0,"energy":{"v^2":"1/2","w^2":"1/2"},"id":"A07","limitation":"Antisymmetric velocity coupling; not friction.","name":"Gyroscopic coupling","rayleigh":{},"residuals":{"q":{"a":"1","w":"-1"},"r":{"b":"1","v":"1"}}},{"action":{"q*v*t":"2","q^2":"1/2","v^2":"1/2"},"checks":3,"empirical_credit":0,"energy":{"q^2":"-1/2","v^2":"1/2"},"id":"A08","limitation":"Oscillator plus d(t*q^2)/dt; fixed endpoints are required.","name":"Total derivative","rayleigh":{},"residuals":{"q":{"a":"1","q":"1"}}},{"action":{"q^2*w^2":"1/2","v^2":"1/2","w^2":"1/2"},"checks":4,"empirical_credit":0,"energy":{"q^2*w^2":"1/2","v^2":"1/2","w^2":"1/2"},"id":"A09","limitation":"r is cyclic; its momentum is (1+q^2)*w, not simply w.","name":"Cyclic coordinate","rayleigh":{},"residuals":{"q":{"a":"1","q*w^2":"-1"},"r":{"b":"1","q*v*w":"2","q^2*b":"1"}}},{"action":{"q*r":"1","q^2":"-1/2","r^2":"-1/2","v^2":"1/2","w^2":"1/2"},"checks":4,"empirical_credit":0,"energy":{"q*r":"-1","q^2":"1/2","r^2":"1/2","v^2":"1/2","w^2":"1/2"},"id":"A10","limitation":"Potential depends on coordinate difference; the momentum sum is conserved on shell.","name":"Translational pair symmetry","rayleigh":{},"residuals":{"q":{"a":"1","q":"1","r":"-1"},"r":{"b":"1","q":"-1","r":"1"}}},{"action":{"q*r":"1","q^2":"-1","r^2":"-1","v^2":"1/2","w^2":"1/2"},"checks":4,"empirical_credit":0,"energy":{"q*r":"-1","q^2":"1","r^2":"1","v^2":"1/2","w^2":"1/2"},"id":"A11","limitation":"Two sites with zero endpoint values; unlike the free pair, translation is broken.","name":"Anchored lattice gradient","rayleigh":{},"residuals":{"q":{"a":"1","q":"2","r":"-1"},"r":{"b":"1","q":"-1","r":"2"}}},{"action":{"l":"-1","q^2*l":"1","r^2*l":"1","v^2":"1/2","w^2":"1/2"},"checks":5,"empirical_credit":0,"energy":{"l":"1","q^2*l":"-1","r^2*l":"-1","v^2":"1/2","w^2":"1/2"},"id":"A12","limitation":"Constraint equation is required; this is a differential-algebraic model, not an unconstrained ODE.","name":"Holonomic multiplier","rayleigh":{},"residuals":{"l":{"1":"1","q^2":"-1","r^2":"-1"},"q":{"a":"1","q*l":"-2"},"r":{"b":"1","r*l":"-2"}}},{"action":{"q^2":"-1/2","r^2":"-1/2","v^2":"1/2","w^2":"1/2"},"checks":4,"empirical_credit":0,"energy":{"q^2":"1/2","r^2":"1/2","v^2":"1/2","w^2":"1/2"},"id":"A13","limitation":"g>=0; dissipative forces are added explicitly, not derived from the conservative action alone.","name":"Rayleigh dissipation","rayleigh":{"v^2*g":"1/2","w^2*g":"1/2"},"residuals":{"q":{"a":"1","q":"1","v*g":"1"},"r":{"b":"1","r":"1","w*g":"1"}}},{"action":{"q^2":"-1","r^2":"-1","v^2":"1","w^2":"1"},"checks":4,"empirical_credit":0,"energy":{"q^2":"1","r^2":"1","v^2":"1","w^2":"1"},"id":"A14","limitation":"x=q+r, y=q-r; an invertible, non-normalized change transforms both kinetic and potential terms.","name":"Linear coordinate pullback","rayleigh":{},"residuals":{"q":{"a":"2","q":"2"},"r":{"b":"2","r":"2"}}},{"action":{"q^2*p":"-1/2","q^2*s":"-1/2","v^2":"1/2"},"checks":3,"empirical_credit":0,"energy":{"q^2*p":"1/2","q^2*s":"1/2","v^2":"1/2"},"id":"A15","limitation":"The residual identifies p+s under this model, not p and s separately.","name":"Sum-only parameter observation","rayleigh":{},"residuals":{"q":{"a":"1","q*p":"1","q*s":"1"}}}];
 const labels={q:'Position q',r:'Position r',l:'Multiplier l',v:'Velocity v',w:'Velocity w',u:'Multiplier rate u',a:'Acceleration a',b:'Acceleration b',c:'Multiplier acceleration c',t:'Time t',g:'Damping g',p:'Parameter p',s:'Parameter s'};
 const defaults={q:1,r:0,l:0,v:0,w:0,u:0,a:-1,b:0,c:0,t:1,g:1,p:1,s:2};
 const at=id=>root.querySelector('#'+id), selector=at('ghc-var-model');
 let current=models[0],state={...defaults},valid=true,initialized=false;
 function vars(m){const found=new Set();for(const poly of [m.action,m.rayleigh,...Object.values(m.residuals)])for(const term of Object.keys(poly))if(term!=='1')for(const atom of term.split('*'))found.add(atom.split('^')[0]);return Object.keys(labels).filter(k=>found.has(k));}
 function coefficient(value){const parts=value.split('/').map(Number);return parts.length===2?parts[0]/parts[1]:parts[0];}
 function evaluate(poly){let total=0;for(const [monomial,value]of Object.entries(poly)){let term=coefficient(value);if(monomial!=='1')for(const atom of monomial.split('*')){const [name,power='1']=atom.split('^');term*=state[name]**Number(power);}total+=term;}return total;}
 function attributes(id,values){for(const [k,v]of Object.entries(values))at(id).setAttribute(k,String(v));}
 function draw(){
   const plot=at('ghc-var-plot');plot.style.visibility=valid?'visible':'hidden';if(!valid)return;
   const width=Math.max(240,plot.parentElement.clientWidth),height=220,left=38,right=width-38,top=28,bottom=178;
   const x=q=>left+6+(q+4)/8*(right-left-12), y=r=>bottom-6-(r+4)/8*(bottom-top-12);
   attributes('ghc-var-plot',{viewBox:'0 0 '+width+' '+height,width,height});
   attributes('ghc-var-x-axis',{x1:left,y1:y(0),x2:right,y2:y(0)});attributes('ghc-var-y-axis',{x1:x(0),y1:top,x2:x(0),y2:bottom});
   attributes('ghc-var-clip-rect',{x:left,y:top,width:right-left,height:bottom-top});
   attributes('ghc-var-x-label',{x:width/2,y:211,'text-anchor':'middle'});attributes('ghc-var-y-label',{x:8,y:24});
   attributes('ghc-var-minus',{x:left,y:195});attributes('ghc-var-plus',{x:right,y:195,'text-anchor':'end'});
   attributes('ghc-var-position',{cx:x(state.q),cy:y(state.r)});const norm=Math.max(1,Math.hypot(state.v,state.w));
   attributes('ghc-var-velocity',{x1:x(state.q),y1:y(state.r),x2:x(state.q)+state.v/norm*22,y2:y(state.r)-state.w/norm*22});
 }
 function render(){
   valid=true;for(const key of vars(current)){const field=at('ghc-var-state-'+key);state[key]=Number(field.value);if(!field.value.trim()||!Number.isFinite(state[key])||Math.abs(state[key])>4)valid=false;}
   let error=valid?'':'Use finite values between −4 and 4.';
   if(valid&&current.id==='A05'&&state.t<=0){valid=false;error='This example requires time greater than zero.';}
   if(valid&&current.id==='A13'&&state.g<0){valid=false;error='This example requires nonnegative damping.';}
   at('ghc-var-error').textContent=error;const body=at('ghc-var-results');body.replaceChildren();
   if(valid)for(const [q,poly]of Object.entries(current.residuals)){const tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.scope='row';th.textContent='E('+q+')';td.className='text-end';const value=evaluate(poly);td.textContent=Math.abs(value)<1e-12?'0 (rounded)':Number(value.toPrecision(8)).toString();tr.append(th,td);body.append(tr);}draw();
 }
 function save(){if(valid&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{model:current.id,state:{...state}},privateContent:null}).catch(()=>{});}
 function choose(){
   const fields=at('ghc-var-inputs');fields.replaceChildren();selector.value=current.id;
   for(const key of vars(current)){const label=document.createElement('label');label.className='form-label';label.textContent=labels[key];const input=document.createElement('input');input.className='form-control';input.id='ghc-var-state-'+key;input.type='number';input.min='-4';input.max='4';input.step='0.25';input.value=state[key];label.append(input);fields.append(label);input.addEventListener('input',()=>{render();save();});}initialized=true;render();
 }
 function restore(incoming){const saved=incoming?.modelContent;if(!saved||typeof saved!=='object')return false;const candidate=models.find(m=>m.id===saved.model);if(!candidate)return false;const next={...defaults};for(const key of Object.keys(defaults)){const value=saved.state?.[key];if(typeof value==='number'&&Number.isFinite(value)&&Math.abs(value)<=4)next[key]=value;}if(initialized&&candidate.id===current.id&&Object.keys(defaults).every(k=>next[k]===state[k]))return true;current=candidate;state=next;choose();return true;}
 for(const model of models){const option=document.createElement('option');option.value=model.id;option.textContent=model.id+' · '+model.name;selector.append(option);}
 selector.addEventListener('change',()=>{current=models.find(m=>m.id===selector.value)||models[0];state={...defaults};choose();save();});
 window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals&&Object.hasOwn(event.detail.globals,'widgetState'))restore(event.detail.globals.widgetState);});
 if(!restore(window.openai?.widgetState))choose();
 new ResizeObserver(draw).observe(at('ghc-var-plot').parentElement);
})();
</script>
