<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caelen v704-v8 finite topology atlas</title>
<style>body{font-family:system-ui;max-width:72rem;margin:auto;padding:1rem;background:#fbfaf7;color:#17212b}button,select{font:inherit;padding:.5rem}canvas{border:1px solid #456;max-width:100%}table{border-collapse:collapse;width:100%}th,td{border:1px solid #789;padding:.4rem;text-align:left}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head>
<body><h1>Finite topology atlas</h1><p>This is a nonphysical projection of synthetic finite records. It is not a route, safety plan, accessibility-conformance result, or authority decision.</p>
<label for="profile">Profile</label> <select id="profile"></select> <button id="left" type="button">Rotate left</button> <button id="right" type="button">Rotate right</button>
<canvas id="plot" width="640" height="320" aria-label="Three-coordinate synthetic topology projection"></canvas>
<h2>Exact fallback table</h2><table><thead><tr><th>Profile</th><th>Open sets</th><th>T0 quotient points</th><th>Components</th></tr></thead><tbody id="rows"></tbody></table>
<script>const models=[{"profile_id":"CAT-01","coordinates":{"open_set_count":8,"quotient_point_count":3,"component_count":3},"physical_interpretation":false},{"profile_id":"CAT-02","coordinates":{"open_set_count":2,"quotient_point_count":1,"component_count":1},"physical_interpretation":false},{"profile_id":"CAT-03","coordinates":{"open_set_count":4,"quotient_point_count":3,"component_count":1},"physical_interpretation":false},{"profile_id":"CAT-04","coordinates":{"open_set_count":5,"quotient_point_count":3,"component_count":1},"physical_interpretation":false},{"profile_id":"CAT-05","coordinates":{"open_set_count":5,"quotient_point_count":3,"component_count":1},"physical_interpretation":false},{"profile_id":"CAT-06","coordinates":{"open_set_count":6,"quotient_point_count":4,"component_count":1},"physical_interpretation":false},{"profile_id":"CAT-07","coordinates":{"open_set_count":5,"quotient_point_count":4,"component_count":1},"physical_interpretation":false},{"profile_id":"CAT-08","coordinates":{"open_set_count":9,"quotient_point_count":4,"component_count":2},"physical_interpretation":false},{"profile_id":"CAT-09","coordinates":{"open_set_count":9,"quotient_point_count":4,"component_count":1},"physical_interpretation":false},{"profile_id":"CAT-10","coordinates":{"open_set_count":9,"quotient_point_count":4,"component_count":1},"physical_interpretation":false},{"profile_id":"CAT-11","coordinates":{"open_set_count":6,"quotient_point_count":3,"component_count":2},"physical_interpretation":false},{"profile_id":"CAT-12","coordinates":{"open_set_count":6,"quotient_point_count":5,"component_count":1},"physical_interpretation":false},{"profile_id":"CAT-13","coordinates":{"open_set_count":17,"quotient_point_count":5,"component_count":1},"physical_interpretation":false},{"profile_id":"CAT-14","coordinates":{"open_set_count":12,"quotient_point_count":5,"component_count":2},"physical_interpretation":false},{"profile_id":"CAT-15","coordinates":{"open_set_count":9,"quotient_point_count":4,"component_count":2},"physical_interpretation":false}];let angle=0;const select=document.querySelector("#profile");const rows=document.querySelector("#rows");for(const m of models){const o=document.createElement("option");o.value=m.profile_id;o.textContent=m.profile_id;select.append(o);const tr=document.createElement("tr");for(const v of [m.profile_id,m.coordinates.open_set_count,m.coordinates.quotient_point_count,m.coordinates.component_count]){const td=document.createElement("td");td.textContent=v;tr.append(td)}rows.append(tr)}function draw(){const c=document.querySelector("#plot"),x=c.getContext("2d"),m=models.find(v=>v.profile_id===select.value)||models[0];x.clearRect(0,0,c.width,c.height);x.fillStyle="#17212b";x.fillText(m.profile_id+" — nonphysical coordinates",20,30);const v=[m.coordinates.open_set_count,m.coordinates.quotient_point_count,m.coordinates.component_count];v.forEach((n,i)=>{const px=120+i*180+Math.cos(angle+i)*20,py=260-n*8+Math.sin(angle+i)*20;x.fillStyle=["#246","#864","#486"][i];x.beginPath();x.arc(px,py,10,0,Math.PI*2);x.fill();x.fillText(String(n),px+14,py)})}select.addEventListener("change",draw);document.querySelector("#left").addEventListener("click",()=>{angle-=.2;draw()});document.querySelector("#right").addEventListener("click",()=>{angle+=.2;draw()});draw();</script>
</body></html>
