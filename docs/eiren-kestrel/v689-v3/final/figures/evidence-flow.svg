<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" role="img" aria-labelledby="t d"><title id="t">Eiren evidence lifecycle</title><desc id="d">Planning leads to x1, x2, final validation, and one guarded successor route. Protected scientific and authority gates remain outside the completion flow.</desc><rect width="1100" height="360" fill="#f7f4ea"/><g font-family="Segoe UI, sans-serif" text-anchor="middle"><g fill="#174a5b" stroke="#0b2933" stroke-width="2"><rect x="40" y="80" width="180" height="90" rx="14"/><rect x="260" y="80" width="180" height="90" rx="14"/><rect x="480" y="80" width="180" height="90" rx="14"/><rect x="700" y="80" width="180" height="90" rx="14"/><rect x="920" y="80" width="140" height="90" rx="14"/></g><g fill="white" font-size="20"><text x="130" y="120">Planning</text><text x="130" y="148">200 + 200</text><text x="350" y="120">X1</text><text x="350" y="148">100 / 100 / 100</text><text x="570" y="120">X2</text><text x="570" y="148">100 / 100 / 100</text><text x="790" y="120">Exact final</text><text x="790" y="148">one canonical</text><text x="990" y="120">Elaren</text><text x="990" y="148">one send</text></g><g stroke="#a55427" stroke-width="5" fill="none"><path d="M220 125h40"/><path d="M440 125h40"/><path d="M660 125h40"/><path d="M880 125h40"/></g><rect x="180" y="235" width="740" height="70" rx="12" fill="#f2d7c2" stroke="#a55427" stroke-width="2"/><text x="550" y="265" font-size="20" fill="#5c2914">Empirical, professional, participant, legal, cultural, Maori-authority,</text><text x="550" y="290" font-size="20" fill="#5c2914">independent-reproduction, consciousness and Stage 20 gates remain open.</text></g></svg>
